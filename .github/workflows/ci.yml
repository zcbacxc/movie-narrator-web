name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend dependencies
        working-directory: webui
        run: npm ci

      - name: Type-check and build frontend
        working-directory: webui
        run: npm run build

      - name: Verify build output
        run: |
          test -f src/movie_narrator_web/static/index.html
          test -n "$(ls src/movie_narrator_web/static/assets/*.js)"
          test -n "$(ls src/movie_narrator_web/static/assets/*.css)"
          echo "Frontend build verified"

  web-tests:
    runs-on: ubuntu-latest
    needs: [frontend]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install core engine (from GitHub — PyPI may lag behind)
        run: pip install git+https://github.com/zcbacxc/movie-narrator.git

      - name: Install web dependencies (runtime + dev)
        run: pip install "fastapi>=0.104.0" "uvicorn[standard]>=0.24.0" "python-multipart>=0.0.6" "pytest>=8.0"

      - name: Install web package (editable, skip dep resolution)
        run: pip install --no-deps -e .

      - name: Run web package tests
        run: pytest tests/ -v

      - name: Verify mn-web entry point
        run: mn-web --help || true

  test:
    needs: [web-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [[ "${{ needs.web-tests.result }}" == "success" ]]; then
            echo "All matrix jobs passed"
          else
            echo "Matrix jobs failed: ${{ needs.web-tests.result }}"
            exit 1
          fi
